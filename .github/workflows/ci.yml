name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: proviso
          POSTGRES_PASSWORD: proviso
          POSTGRES_DB: proviso
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U proviso -d proviso"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://proviso:proviso@localhost:5433/proviso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: proviso db init
      - run: proviso evalset check evalset/examples.jsonl
      - run: pytest -v

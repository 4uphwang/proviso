# 4장 Q2: 3장 최종에서 벡터 쪽만 HyDE(로컬 LLM이 쓴 가상 조문 + 원래 질문으로 검색). BM25는 원래 질문
name: q2-hyde-pp0
retriever:
  type: rrf
  expand_aliases: true
  params:
    k_rrf: 60
    depth: 100
    parts:
      dense: {type: dense, params: {index: c3c1-bge-m3}, query_llm: {mode: hyde, model: "qwen3.5:4b", presence_penalty: 0.0}}
      bm25: {type: bm25, params: {tokenizer: morph, header: true, as_of: "2026-11-20"}}
evalset: evalset/retrieval.jsonl
split: dev
k: 20
repeats: 1
use_as_of: true

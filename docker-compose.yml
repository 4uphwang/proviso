services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: proviso
      POSTGRES_PASSWORD: proviso
      POSTGRES_DB: proviso
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proviso -d proviso"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:

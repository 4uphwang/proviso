[project]
name = "proviso"
version = "0.1.0"
description = "금융 법령·약관을 근거로만 답하는 도구 사용 에이전트와 평가 하네스"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# 로컬 임베딩(bge-m3 등). 모델은 처음 쓸 때 Hugging Face에서 받아 ~/.cache/huggingface에 둔다
embed = ["sentence-transformers>=3.0", "torch>=2.4"]

[project.scripts]
proviso = "proviso.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: Postgres가 떠 있어야 하는 테스트(DATABASE_URL). 없으면 건너뛴다"]
